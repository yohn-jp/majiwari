tunnel: <TUNNEL_UUID>
credentials-file: /home/you/.cloudflared/<TUNNEL_UUID>.json

ingress:
  - hostname: <GATEWAY_HOSTNAME>
    service: http://127.0.0.1:8787
    # Keep Access validation on this ingress rule. A top-level access block
    # does not constrain a hostname-specific route reliably.
    originRequest:
      access:
        required: true
        teamName: <CLOUDFLARE_ACCESS_TEAM_NAME>
        audTag:
          - <ACCESS_APPLICATION_AUDIENCE_TAG>
  - service: http_status:404
